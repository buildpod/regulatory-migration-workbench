[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-migration-workbench"
version = "0.1.0"
description = "Local-first data quality and regulatory reference workbench for life-sciences migrations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
regulatory-workbench = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

